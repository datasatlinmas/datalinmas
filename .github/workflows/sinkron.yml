name: Sinkron Satlinmas

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sinkron:
    runs-on: ubuntu-latest
    env:
      SIMLINMAS_EMAIL: ${{ secrets.SIMLINMAS_EMAIL }}
      SIMLINMAS_PASSWORD: ${{ secrets.SIMLINMAS_PASSWORD }}
      SIMLINMAS_PASSWORD_ANGGOTA: ${{ secrets.SIMLINMAS_PASSWORD_ANGGOTA }}
      SIMLINMAS_RELAY_URL: https://satpolpp.ponorogo.go.id/satlinmas/proxy/sinkron_proxy.php
      SIMLINMAS_RELAY_TOKEN: ${{ secrets.SIMLINMAS_RELAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip openpyxl pillow
      - run: python bulklinmas/sinkron_semua.py cek
