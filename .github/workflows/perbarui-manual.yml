name: Perbarui Data Satlinmas (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sinkron-satlinmas
  cancel-in-progress: false

jobs:
  perbarui:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript rclone

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pillow openpyxl curl_cffi

      - name: Restore rclone config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -z "$RCLONE_CONFIG" ]; then
            echo "RCLONE_CONFIG secret belum diisi"; exit 1
          fi
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Restore cache state kecil (opsional)
        uses: actions/cache@v4
        with:
          path: |
            bulklinmas/.sinkron_semua_state.json
          key: satlinmas-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            satlinmas-state-${{ runner.os }}-

      - name: Jalankan perbarui semua data
        env:
          PYTHONUNBUFFERED: "1"
          SIMLINMAS_EMAIL: ${{ secrets.SIMLINMAS_EMAIL }}
          SIMLINMAS_PASSWORD: ${{ secrets.SIMLINMAS_PASSWORD }}
          SIMLINMAS_PASSWORD_ANGGOTA: ${{ secrets.SIMLINMAS_PASSWORD_ANGGOTA }}
          SIMLINMAS_RELAY_URL: ${{ secrets.SIMLINMAS_RELAY_URL }}
          SIMLINMAS_RELAY_TOKEN: ${{ secrets.SIMLINMAS_RELAY_TOKEN }}
        working-directory: bulklinmas
        run: |
          python3 -u sinkron_semua.py perbarui

      - name: Tulis ringkasan ke GitHub Step Summary
        if: always()
        run: |
          if [ -f bulklinmas/ringkasan_sinkron.md ]; then
            cat bulklinmas/ringkasan_sinkron.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f bulklinmas/sinkron_semua.log ]; then
            echo "## Perbarui Satlinmas" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -80 bulklinmas/sinkron_semua.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cleanup data besar (ephemeral)
        if: always()
        run: |
          rm -rf "DATA SATLINMAS PONOROGO"
          rm -f bulklinmas/bulk-simlinmas-ponorogo-siap-*.xlsx
          rm -f bulklinmas/sinkron_semua.log
